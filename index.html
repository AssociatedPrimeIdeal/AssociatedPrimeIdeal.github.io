<!doctype html>
<html lang="en">

  <title>Color Block Push</title>
  <style>
    :root{--bg:#070a13;--panel:#11172a;--line:rgba(219,226,255,.15);--text:#f7f8ff;--muted:#8f9aba;--accent:#9b8cff;--shadow:0 20px 70px rgba(0,0,0,.42)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% -10%,#302b6c 0,transparent 38%),radial-gradient(circle at 100% 10%,#124c53 0,transparent 34%),var(--bg)}
    button,input{font:inherit}button{border:0;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{width:min(100%,620px);height:100%;margin:auto;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:12px}
    .topbar{height:48px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}.brand{justify-self:start;width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#8e7cfd,#5ccfd2);box-shadow:0 7px 20px rgba(110,99,235,.28)}.brand-icon{width:15px;height:15px;display:grid;grid-template-columns:repeat(2,1fr);gap:2px}.brand-icon i{border-radius:2px;background:#fff}.level{justify-self:center;display:flex;align-items:center;gap:7px;color:#cbd2eb;font-size:.72rem;font-weight:800;letter-spacing:.13em}.level b{color:#fff;font-size:.9rem;letter-spacing:.04em}.top-actions{display:flex;justify-content:flex-end;gap:4px}.icon-button{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:rgba(155,166,215,.1);color:#dfe5ff;font-size:1.08rem;transition:transform .15s,background .15s}.icon-button:hover,.icon-button:focus-visible{background:rgba(155,140,255,.25);transform:translateY(-1px);outline:0}.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .board-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 7px}.board-shell{position:relative;width:min(100%,540px);max-height:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}.board-shell:before{content:"";position:absolute;inset:2.5%;border-radius:27px;background:rgba(3,5,12,.6);box-shadow:inset 0 0 0 1px rgba(210,220,255,.12),0 24px 60px rgba(0,0,0,.35)}#board{position:relative;width:94%;height:94%;display:grid;gap:4px;padding:8px;border-radius:20px;background:#050711;box-shadow:inset 0 0 0 1px rgba(222,228,255,.13);touch-action:none;user-select:none}.cell{position:relative;min-width:0;aspect-ratio:1;border-radius:5px;background:rgba(141,157,211,.07)}.tile{position:absolute;inset:2px;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 8px rgba(0,0,0,.35);will-change:transform,opacity}.tile:after{content:"";position:absolute;inset:14%;border:1px solid rgba(255,255,255,.2);border-radius:2px}.tile.move-left{animation:move-left .19s cubic-bezier(.2,.7,.25,1)}.tile.move-right{animation:move-right .19s cubic-bezier(.2,.7,.25,1)}.tile.move-up{animation:move-up .19s cubic-bezier(.2,.7,.25,1)}.tile.move-down{animation:move-down .19s cubic-bezier(.2,.7,.25,1)}.tile.vanish{animation:vanish .3s cubic-bezier(.2,.8,.3,1) forwards;z-index:3}.board-pulse{animation:pulse .32s ease-out}@keyframes move-left{from{transform:translateX(24%)}to{transform:translateX(0)}}@keyframes move-right{from{transform:translateX(-24%)}to{transform:translateX(0)}}@keyframes move-up{from{transform:translateY(24%)}to{transform:translateY(0)}}@keyframes move-down{from{transform:translateY(-24%)}to{transform:translateY(0)}}@keyframes vanish{0%{transform:scale(1);opacity:1}55%{transform:scale(1.24);opacity:.95}100%{transform:scale(.05);opacity:0}}@keyframes pulse{0%{box-shadow:inset 0 0 0 1px rgba(222,228,255,.13),0 0 0 rgba(155,140,255,0)}50%{box-shadow:inset 0 0 0 1px rgba(222,228,255,.35),0 0 35px rgba(155,140,255,.32)}100%{box-shadow:inset 0 0 0 1px rgba(222,228,255,.13),0 0 0 rgba(155,140,255,0)}}
    .edge{position:absolute;z-index:2;pointer-events:none;filter:drop-shadow(0 0 4px currentColor)}.edge.top,.edge.bottom{left:12%;right:12%;height:3px}.edge.top{top:1.4%}.edge.bottom{bottom:1.4%}.edge.left,.edge.right{top:12%;bottom:12%;width:3px}.edge.left{left:1.4%}.edge.right{right:1.4%}.complete{position:absolute;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none;opacity:0}.complete.show{animation:complete .68s ease-out}.complete-mark{width:68px;height:68px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.8);border-radius:50%;color:#fff;font-size:2rem;background:rgba(10,13,27,.55);box-shadow:0 0 45px rgba(255,255,255,.35)}@keyframes complete{0%{opacity:0;transform:scale(.45)}35%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
    .bottom-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:5px 4px}.counter{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.07em}.counter:last-child{justify-content:flex-end}.counter b{color:#eef1ff;font-size:1rem;letter-spacing:0}.swipe-hint{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:rgba(156,143,255,.2);color:#e9e7ff}.swipe-hint svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .controls{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);justify-content:center;gap:6px;padding-bottom:3px}.dir{border-radius:13px;background:rgba(157,169,218,.13);color:#edf0ff;font-size:1.25rem;transition:background .15s,transform .15s}.dir:active{transform:scale(.92);background:rgba(155,140,255,.38)}.dir.up{grid-column:2}.dir.left{grid-column:1;grid-row:2}.dir.down{grid-column:2;grid-row:2}.dir.right{grid-column:3;grid-row:2}
    .settings{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(2,4,11,.68);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .2s}.settings.open{opacity:1;pointer-events:auto}.settings-panel{width:min(100%,520px);max-height:min(86dvh,620px);overflow:auto;padding:20px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#1a2240,#0e1427);box-shadow:var(--shadow);transform:translateY(25px);transition:transform .24s}.settings.open .settings-panel{transform:translateY(0)}.settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.settings-head h2{margin:0;font-size:1.1rem}.close{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:rgba(160,173,220,.12);font-size:1.2rem}.setting-row{padding:14px 0;border-top:1px solid var(--line)}.setting-label{display:block;margin-bottom:9px;color:#dce3fc;font-size:.78rem;font-weight:750}.dimensions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.dimensions label{display:grid;gap:5px;color:var(--muted);font-size:.7rem}.dimensions input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;outline:0;color:var(--text);background:rgba(4,8,17,.55)}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.palette label{display:grid;gap:5px;color:var(--muted);font-size:.67rem;text-align:center}.palette input{width:100%;height:35px;padding:2px;border:1px solid var(--line);border-radius:8px;background:transparent}.upload{display:flex;align-items:center;gap:10px;padding:11px;border:1px dashed rgba(155,140,255,.55);border-radius:11px;background:rgba(119,102,233,.08)}.upload input{display:none}.upload-button{padding:8px 11px;border-radius:8px;background:rgba(155,140,255,.24);color:#e3e4ff;font-size:.77rem;font-weight:750}.upload-name{overflow:hidden;color:var(--muted);font-size:.73rem;text-overflow:ellipsis;white-space:nowrap}.settings-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.settings-actions button{padding:11px;border-radius:11px;font-weight:750}.save{background:linear-gradient(135deg,#8978fa,#5963dd)}.cancel{background:rgba(158,170,218,.12)}
    @media(max-height:620px){.app{gap:5px}.topbar{height:42px}.board-area{padding:3px 7px}.controls{grid-template-rows:repeat(2,36px)}.dir{height:36px}.swipe-hint{width:42px;height:42px}}@media(min-width:700px){.app{padding-left:24px;padding-right:24px}.bottom-bar{padding-bottom:10px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand" aria-hidden="true"><span class="brand-icon"><i></i><i></i><i></i><i></i></span></div><div class="level"><span>LEVEL</span><b id="level-number">01</b></div><div class="top-actions"><button class="icon-button" id="restart" aria-label="Restart level" title="Restart"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-4L3 10"/><path d="M3 5v5h5"/><path d="M4 13a8 8 0 0 0 14.8 4L21 14"/><path d="M21 19v-5h-5"/></svg></button><button class="icon-button" id="settings-button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="m19.4 15 .1.1a1.9 1.9 0 0 1-2.7 2.7l-.1-.1a1.9 1.9 0 0 0-3.2 1.3v.2a1.9 1.9 0 0 1-3.8 0V19a1.9 1.9 0 0 0-3.2-1.3l-.1.1a1.9 1.9 0 0 1-2.7-2.7l.1-.1A1.9 1.9 0 0 0 2.6 12a1.9 1.9 0 0 1 0-3.8h.2A1.9 1.9 0 0 0 4.1 5l-.1-.1a1.9 1.9 0 0 1 2.7-2.7l.1.1A1.9 1.9 0 0 0 10 1.1V1a1.9 1.9 0 0 1 3.8 0v.2A1.9 1.9 0 0 0 17 2.5l.1-.1a1.9 1.9 0 0 1 2.7 2.7l-.1.1A1.9 1.9 0 0 0 21 8.2h.2a1.9 1.9 0 0 1 0 3.8H21a1.9 1.9 0 0 0-1.6 3Z"/></svg></button></div></header>
    <section class="board-area" aria-label="Game board"><div class="board-shell" id="board-shell"><i class="edge top" id="edge-top"></i><i class="edge right" id="edge-right"></i><i class="edge bottom" id="edge-bottom"></i><i class="edge left" id="edge-left"></i><div id="board" tabindex="0" aria-label="Color block board"></div><div class="complete" id="complete"><span class="complete-mark">✓</span></div></div></section>
    <div class="bottom-bar"><div class="counter"><span>BLOCKS</span><b id="remaining">0</b></div><div class="swipe-hint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 12V6.8a1.4 1.4 0 0 1 2.8 0V11"/><path d="M9.8 10V5.3a1.4 1.4 0 0 1 2.8 0V11"/><path d="M12.6 10V6.2a1.4 1.4 0 0 1 2.8 0v5"/><path d="M15.4 11V9a1.4 1.4 0 0 1 2.8 0v6.2c0 3.1-2.1 5.2-5.2 5.2h-1.4c-1.7 0-2.8-.7-3.8-2L5.2 15a1.4 1.4 0 0 1 2-2l1.3 1.3"/></svg></div><div class="counter"><span>MOVES</span><b id="moves">0</b></div></div>
    <nav class="controls" aria-label="Move controls"><button class="dir up" data-dir="up" aria-label="Move up">↑</button><button class="dir left" data-dir="left" aria-label="Move left">←</button><button class="dir down" data-dir="down" aria-label="Move down">↓</button><button class="dir right" data-dir="right" aria-label="Move right">→</button></nav>
  </main>
  <div class="settings" id="settings" aria-hidden="true"><section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="settings-head"><h2 id="settings-title">Settings</h2><button class="close" id="close-settings" aria-label="Close settings">×</button></div><div class="setting-row"><span class="setting-label">Board size</span><div class="dimensions"><label>Rows<input id="rows" type="number" min="5" max="18" value="9" /></label><label>Columns<input id="cols" type="number" min="5" max="18" value="9" /></label></div></div><div class="setting-row"><span class="setting-label">Edge colors</span><div class="palette"><label>Top<input type="color" id="color-top" value="#ffcf5a" /></label><label>Right<input type="color" id="color-right" value="#ff6b8a" /></label><label>Bottom<input type="color" id="color-bottom" value="#62e6d4" /></label><label>Left<input type="color" id="color-left" value="#8d7cff" /></label></div></div><div class="setting-row"><span class="setting-label">Custom image (optional)</span><label class="upload"><input id="image-input" type="file" accept="image/*" /><span class="upload-button">Choose image</span><span class="upload-name" id="file-name">No image selected</span></label></div><div class="settings-actions"><button class="cancel" id="cancel-settings">Cancel</button><button class="save" id="save-settings">Apply</button></div></section></div>
  <script>
    (() => {
      const $ = (selector) => document.querySelector(selector); const board = $('#board'); const shell = $('#board-shell'); const settings = $('#settings'); const complete = $('#complete'); const rowsInput = $('#rows'); const colsInput = $('#cols'); const imageInput = $('#image-input'); const imageName = $('#file-name'); const colorInputs = [$('#color-top'), $('#color-right'), $('#color-bottom'), $('#color-left')];
      const state = { rows:9, cols:9, grid:[], level:1, moves:0, seed:0, image:null, imagePending:false, currentUsesImage:false, touching:null, animating:false }; const edgeMap = { up:0, right:1, down:2, left:3 }; const edgeNames = ['top','right','bottom','left']; const colors = () => colorInputs.map((input) => input.value); const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
      function rng(seed){let x=seed>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296;}} function emptyGrid(){return Array.from({length:state.rows},()=>Array(state.cols).fill(null))}
      const patterns=[['..###..','.#####.','#######','#######','.#####.','..###..','...#...'],['.#####.','#######','##.#.##','#######','#######','#.#.#.#','.......'],['...#...','..###..','.#####.','#######','.#####.','..###..','...#...'],['...#...','..###..','.#####.','..###..','...#...','.#...#.','.......']];
      function pixelGrid(){const random=rng(state.seed);const pattern=patterns[Math.floor(random()*patterns.length)];const grid=emptyGrid();const targetH=Math.max(5,Math.floor(state.rows*.76));const targetW=Math.max(5,Math.floor(state.cols*.76));const top=Math.floor((state.rows-targetH)/2);const left=Math.floor((state.cols-targetW)/2);for(let r=0;r<state.rows;r++)for(let c=0;c<state.cols;c++){const sy=Math.floor((r-top)*pattern.length/targetH);const sx=Math.floor((c-left)*pattern[0].length/targetW);if(sy<0||sy>=pattern.length||sx<0||sx>=pattern[0].length||pattern[sy][sx]!=='#')continue;grid[r][c]=Math.floor(random()*4)}if(!grid.flat().some((value)=>value!==null))grid[Math.floor(state.rows/2)][Math.floor(state.cols/2)]=0;return grid}
      function hexRgb(hex){const n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]} function nearestColor(rgb){const palette=colors().map(hexRgb);let best=0;let distance=Infinity;palette.forEach((color,index)=>{const d=(color[0]-rgb[0])**2+(color[1]-rgb[1])**2+(color[2]-rgb[2])**2;if(d<distance){distance=d;best=index}});return best}
      function imageGrid(image){const canvas=document.createElement('canvas');canvas.width=state.cols;canvas.height=state.rows;const context=canvas.getContext('2d',{willReadFrequently:true});context.clearRect(0,0,state.cols,state.rows);const scale=Math.min(state.cols/image.width,state.rows/image.height);const width=image.width*scale;const height=image.height*scale;context.drawImage(image,(state.cols-width)/2,(state.rows-height)/2,width,height);const pixels=context.getImageData(0,0,state.cols,state.rows).data;const grid=emptyGrid();for(let r=0;r<state.rows;r++)for(let c=0;c<state.cols;c++){const i=(r*state.cols+c)*4;if(pixels[i+3]<45)continue;if(pixels[i+3]<180&&(pixels[i]+pixels[i+1]+pixels[i+2])/3>238)continue;grid[r][c]=nearestColor([pixels[i],pixels[i+1],pixels[i+2]])}if(!grid.flat().some((value)=>value!==null))grid[Math.floor(state.rows/2)][Math.floor(state.cols/2)]=0;return grid}
      function render(options={}){board.style.gridTemplateColumns=`repeat(${state.cols},minmax(0,1fr))`;board.replaceChildren();const removed=options.removed||new Map();state.grid.forEach((row,r)=>row.forEach((value,c)=>{const cell=document.createElement('div');cell.className='cell';const key=`${r},${c}`;const tileValue=value===null&&removed.has(key)?removed.get(key):value;if(tileValue!==null&&tileValue!==undefined){const tile=document.createElement('div');tile.className='tile';tile.style.background=colors()[tileValue];if(removed.has(key))tile.classList.add('vanish');else if(options.direction)tile.classList.add(`move-${options.direction}`);cell.append(tile)}board.append(cell)}));$('#remaining').textContent=state.grid.flat().filter((value)=>value!==null).length;$('#moves').textContent=state.moves;edgeNames.forEach((name,index)=>{const edge=$(`#edge-${name}`);edge.style.background=colors()[index];edge.style.color=colors()[index]})}
      function setGrid(grid){state.grid=grid;state.moves=0;render()}
      function push(direction){if(state.animating||!state.grid.length)return;const before=state.grid.map((row)=>row.slice());const after=emptyGrid();if(direction==='left'||direction==='right')for(let r=0;r<state.rows;r++){const values=state.grid[r].filter((value)=>value!==null);const ordered=direction==='left'?values:values.reverse();ordered.forEach((value,i)=>{after[r][direction==='left'?i:state.cols-1-i]=value})}else for(let c=0;c<state.cols;c++){const values=state.grid.map((row)=>row[c]).filter((value)=>value!==null);const ordered=direction==='up'?values:values.reverse();ordered.forEach((value,i)=>{after[direction==='up'?i:state.rows-1-i][c]=value})}const target=edgeMap[direction];const removed=new Map();for(let r=0;r<state.rows;r++)for(let c=0;c<state.cols;c++){const atEdge=direction==='left'?c===0:direction==='right'?c===state.cols-1:direction==='up'?r===0:r===state.rows-1;if(atEdge&&after[r][c]===target){removed.set(`${r},${c}`,after[r][c]);after[r][c]=null}}const changed=after.some((row,r)=>row.some((value,c)=>value!==before[r][c]))||removed.size;if(!changed)return;state.grid=after;state.moves++;state.animating=true;render({direction,removed});shell.classList.remove('board-pulse');void shell.offsetWidth;shell.classList.add('board-pulse');setTimeout(()=>{render();state.animating=false;if(!state.grid.flat().some((value)=>value!==null)){complete.classList.remove('show');void complete.offsetWidth;complete.classList.add('show');setTimeout(nextLevel,650)}},310)}
      function startLevel(level,restart=false){state.level=level;state.seed=(level*2654435761+(restart?0:1013904223))>>>0;state.moves=0;$('#level-number').textContent=String(level).padStart(2,'0');state.animating=false;complete.classList.remove('show');const useImage=Boolean(state.image&&(state.imagePending||(restart&&state.currentUsesImage)));state.imagePending=false;state.currentUsesImage=useImage;if(useImage)setGrid(imageGrid(state.image));else setGrid(pixelGrid())} function nextLevel(){if(state.level<9999)startLevel(state.level+1)}
      function openSettings(){rowsInput.value=state.rows;colsInput.value=state.cols;settings.classList.add('open');settings.setAttribute('aria-hidden','false')}function closeSettings(){settings.classList.remove('open');settings.setAttribute('aria-hidden','true')}
      $('#restart').addEventListener('click',()=>startLevel(state.level,true));$('#settings-button').addEventListener('click',openSettings);$('#close-settings').addEventListener('click',closeSettings);$('#cancel-settings').addEventListener('click',closeSettings);$('#save-settings').addEventListener('click',()=>{state.rows=clamp(parseInt(rowsInput.value,10)||9,5,18);state.cols=clamp(parseInt(colsInput.value,10)||9,5,18);rowsInput.value=state.rows;colsInput.value=state.cols;state.imagePending=Boolean(state.image);closeSettings();startLevel(state.level,true)});colorInputs.forEach((input)=>input.addEventListener('input',()=>render()));
      imageInput.addEventListener('change',()=>{const file=imageInput.files[0];if(!file)return;imageName.textContent=file.name;const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{state.image=image;state.imagePending=true};image.src=reader.result};reader.readAsDataURL(file)});document.querySelectorAll('.dir').forEach((button)=>button.addEventListener('click',()=>push(button.dataset.dir)));
      document.addEventListener('keydown',(event)=>{if(event.target.matches('input,textarea,select,[contenteditable="true"]'))return;const moves={ArrowUp:'up',ArrowRight:'right',ArrowDown:'down',ArrowLeft:'left',w:'up',d:'right',s:'down',a:'left',W:'up',D:'right',S:'down',A:'left'};if(moves[event.key]){event.preventDefault();push(moves[event.key])}if(event.key==='Escape'&&settings.classList.contains('open'))closeSettings()});board.addEventListener('pointerdown',(event)=>{board.setPointerCapture(event.pointerId);state.touching={x:event.clientX,y:event.clientY}});board.addEventListener('pointerup',(event)=>{if(!state.touching)return;const dx=event.clientX-state.touching.x;const dy=event.clientY-state.touching.y;state.touching=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;push(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});board.addEventListener('pointercancel',()=>{state.touching=null});startLevel(1)
    })();
  </script>
</body>
